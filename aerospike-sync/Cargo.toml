[package]
name = "aerospike-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
publish = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aerospike-core = {path = "../aerospike-core", version = "3.0.0-alpha.1", features = ["sync"]}
futures = { version = "0.3.33" }

[features]
rt-tokio = ["aerospike-core/rt-tokio"]
rt-async-std = ["aerospike-core/rt-async-std"]
dynamic-config = ["aerospike-core/dynamic-config"]
lua = ["aerospike-core/lua"]

[dev-dependencies]
aerospike = {path = "../"}
tokio = { version = "1", features = ["rt-multi-thread"] } # for doc tests
