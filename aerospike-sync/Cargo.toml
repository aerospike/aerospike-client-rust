[package]
name = "aerospike-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
publish = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aerospike-core = {path = "../aerospike-core", version = "2.2.0", features = ["sync"]}
futures = { version = "0.3.32" }
# The blocking wrappers drive client futures on the runtime the rt-* feature
# selects: a dedicated tokio runtime, or async-std's global executor. Never a
# third-party executor — a foreign `block_on` cannot drive the selected
# runtime's IO and timers, so a blocking call would hang.
aerospike-rt = { path = "../aerospike-rt", version = "2.2.0" }

[features]
rt-tokio = ["aerospike-core/rt-tokio", "aerospike-rt/rt-tokio"]
rt-async-std = ["aerospike-core/rt-async-std", "aerospike-rt/rt-async-std"]

[dev-dependencies]
# Do NOT dev-depend on the `aerospike` facade here: its default features pull
# in rt-tokio, and resolver-v1 feature unification then enables both runtimes
# on aerospike-rt, so every rt-async-std build of this crate fails to compile.
# Nothing in this crate used it.
tokio = { version = "1", features = ["rt-multi-thread"] } # doc tests and the runtime-context tests