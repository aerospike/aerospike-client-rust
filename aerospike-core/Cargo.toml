[package]
name = "aerospike-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4"
byteorder = "1.5"
ripemd = "0.2"
base64 = "0.22"
rand = "0.10"
lazy_static = "1.5"
thiserror = "2.0.18"
pwhash = "1.0"
serde = { version = "1.0", features = ["derive"], optional = true }
aerospike-rt = { path = "../aerospike-rt", version = "2.1.0" }
futures = { version = "0.3.32" }
async-trait = "0.1.89"
rhexdump = "0.2.0"
regex = "1"
tokio-rustls = { version = "0.26.4", optional = true }
rustls = { version = "0.23.40", optional = true }
async-channel = "2.5.0"
# Borrowed, non-owning socket handle for the connection pool's liveness probe:
# one implementation that works for tokio, async-std and the TLS inner stream,
# with no `unsafe` and no fd ownership. Already in the tree via tokio.
socket2 = "0.6"
hazarc = "0.2.0"

[features]
serialization = ["serde"]
# The aerospike-macro features pick the runtime for `#[aerospike_macro::test]`.
# They used to come in via the `aerospike` facade dev-dependency, which also
# forced rt-tokio and made rt-async-std test builds impossible.
rt-tokio = ["aerospike-rt/rt-tokio", "aerospike-macro/rt-tokio"]
rt-async-std = ["aerospike-rt/rt-async-std", "aerospike-macro/rt-async-std"]
tls = ["rustls", "tokio-rustls"]
sync = []

[dev-dependencies]
env_logger = "0.11"
hex = "0.4"
bencher = "0.1"
serde_json = "1.0"
# Do NOT dev-depend on the `aerospike` facade: its default features pull in
# rt-tokio, and resolver-v1 unification then enables both runtimes on
# aerospike-rt, so no rt-async-std test of this crate can compile. Doctests here
# say `use aerospike::…` because this crate's own lib is named `aerospike`.
aerospike-macro = {path = "../aerospike-macro"}
lazy_static = "1.5"
tokio = { version = "1.52.1", features = ["full"] }
webpki-roots = "1"
