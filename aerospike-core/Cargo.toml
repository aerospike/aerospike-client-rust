[package]
name = "aerospike-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Aerospike Client for Rust: the async client. Depend on the `aerospike` crate, which re-exports it."
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
readme = "README.md"
rust-version.workspace = true

[dependencies]
# Partition status locks: one byte each and no allocation on first lock. The
# std mutex lazily boxes a pthread_mutex_t per instance on macOS, which for a
# 4096-entry partition array meant 4096 allocations per query.
parking_lot = "0.12"
log = "0.4"
byteorder = "1.5"
ripemd = "0.2"
base64 = "0.23"
rand = "0.10"
# Password hashing for `LOGIN` / user management: bcrypt with the fixed salt
# every Aerospike client uses. Small, maintained, on the same base64/blowfish
# versions as the rest of the tree.
bcrypt = { version = "0.19", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"], optional = true }
# serde_yaml's maintained continuation (same API); its predecessor serde_yml
# was a 0.0.x fork.
serde_norway = { version = "0.9", optional = true }
aerospike-macro = { workspace = true, optional = true }
# Everything runtime-specific, tokio included, comes through aerospike-rt.
aerospike-rt = { workspace = true }
futures = { version = "0.3.34" }
async-trait = "0.1.92"
flate2 = "1"
regex = "1"
# rustls with the `ring` crypto provider: pure Rust + assembly, no cmake or C
# toolchain on the build host, and exactly one provider compiled in so
# `ClientConfig::builder()` picks it without a process-level install. A crate
# that also enables rustls's `aws-lc-rs` feature must install a default
# `CryptoProvider` itself, as rustls requires whenever two are compiled in.
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "logging", "tls12"], optional = true }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
async-channel = "2.5.0"
# Borrowed, non-owning socket handle for the connection pool liveness probe:
# one implementation covering tokio, async-std and the TLS inner stream, with no
# unsafe and no fd ownership. Already in the tree via tokio.
socket2 = "0.6"
hazarc = "0.2.0"
indexmap = "2"
# `async` so stream reads/writes are await points on the client executor
# (no dedicated OS thread per aggregation); `send` because the pipeline
# future must be Send to run on the multi-threaded runtimes.
mlua = { version = "0.11", features = ["lua54", "vendored", "async", "send"], optional = true }

[features]
serialization = ["serde", "indexmap/serde"]
# Dynamic configuration: read policy overrides from a pluggable source (YAML
# file out of the box) and apply them at runtime. Pulls serde for deserialization,
# serde_norway for the file provider, and the Config derive macro.
dynamic-config = ["serde", "serde_norway", "aerospike-macro"]
# Client-side Lua for `Client::query_aggregate` (stream UDF aggregation).
# Bundles a vendored Lua 5.4 interpreter via mlua; off by default so the
# interpreter is only compiled in when explicitly requested.
lua = ["mlua"]
rt-tokio = ["aerospike-rt/rt-tokio", "aerospike-macro?/rt-tokio"]
rt-async-std = ["aerospike-rt/rt-async-std", "aerospike-macro?/rt-async-std"]
# Forwarded to aerospike-rt so its guard turns `tls` + `rt-async-std` into one
# clear compile error instead of trait-bound failures in the connection layer.
tls = ["rustls", "tokio-rustls", "aerospike-rt/tls"]
sync = []

[package.metadata.docs.rs]
# No default features here, so this table is the only thing that gets this
# crate's own docs.rs build past aerospike-rt's runtime-selection guard.
features = ["rt-tokio", "tls", "dynamic-config", "sync", "serialization", "lua"]
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
env_logger = "0.11"
hex = "0.4"
serde_json = "1.0"
serde_bytes = "0.11"
# Used only by doc-tests inside `aerospike-core` (`use aerospike::…` in
# rustdoc snippets). Strip default features so testing this crate under
# `rt-async-std` doesn't transitively re-enable `rt-tokio` via the umbrella's
# defaults — that conflict makes `aerospike-rt` fail to compile with
# duplicate `fs` / `io` / `Mutex` / … re-exports. Re-enable just `async`
# so the umbrella's own `compile_error!` for "select a client version" is
# satisfied; the runtime flag flows through whatever is set on
# `aerospike-core` itself.
aerospike = { path = "../", default-features = false, features = ["async"] }
aerospike-macro = { workspace = true }
tokio = { version = "1.53.1", features = ["full"] }
webpki-roots = "1"
