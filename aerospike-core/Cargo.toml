[package]
name = "aerospike-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Partition status locks: one byte each and no allocation on first lock. The
# std mutex lazily boxes a pthread_mutex_t per instance on macOS, which for a
# 4096-entry partition array meant 4096 allocations per query.
parking_lot = "0.12"
log = "0.4"
byteorder = "1.5"
ripemd = "0.2"
base64 = "0.22"
rand = "0.10"
lazy_static = "1.5"
pwhash = "1.0"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_yml = { version = "0.0.13", optional = true }
aerospike-macro = { path = "../aerospike-macro", version = "3.0.0-alpha.1", optional = true }
aerospike-rt = { path = "../aerospike-rt", version = "3.0.0-alpha.1" }
# `tokio::select!` macro needs a direct dep; runtime features come via aerospike-rt.
tokio = { version = "1", default-features = false, features = ["macros"] }
futures = { version = "0.3.33" }
async-trait = "0.1.91"
rhexdump = "0.2.0"
flate2 = "1"
regex = "1"
tokio-rustls = { version = "0.26.4", optional = true }
rustls = { version = "0.23.42", optional = true }
async-channel = "2.5.0"
# Borrowed, non-owning socket handle for the connection pool liveness probe:
# one implementation covering tokio, async-std and the TLS inner stream, with no
# unsafe and no fd ownership. Already in the tree via tokio.
socket2 = "0.6"
hazarc = "0.2.0"
indexmap = "2"
# `async` so stream reads/writes are await points on the client executor
# (no dedicated OS thread per aggregation); `send` because the pipeline
# future must be Send to run on the multi-threaded runtimes.
mlua = { version = "0.12", features = ["lua54", "vendored", "async", "send"], optional = true }

[features]
serialization = ["serde", "indexmap/serde"]
# Dynamic configuration: read policy overrides from a pluggable source (YAML
# file out of the box) and apply them at runtime. Pulls serde for deserialization,
# serde_yml for the file provider, and the Config derive macro.
dynamic-config = ["serde", "serde_yml", "aerospike-macro"]
# Client-side Lua for `Client::query_aggregate` (stream UDF aggregation).
# Bundles a vendored Lua 5.4 interpreter via mlua; off by default so the
# interpreter is only compiled in when explicitly requested.
lua = ["mlua"]
rt-tokio = ["aerospike-rt/rt-tokio", "aerospike-macro?/rt-tokio"]
rt-async-std = ["aerospike-rt/rt-async-std", "aerospike-macro?/rt-async-std"]
tls = ["rustls", "tokio-rustls"]
sync = []

[dev-dependencies]
env_logger = "0.11"
hex = "0.4"
bencher = "0.1"
serde_json = "1.0"
serde_bytes = "0.11"
# Used only by doc-tests inside `aerospike-core` (`use aerospike::…` in
# rustdoc snippets). Strip default features so testing this crate under
# `rt-async-std` doesn't transitively re-enable `rt-tokio` via the umbrella's
# defaults — that conflict makes `aerospike-rt` fail to compile with
# duplicate `fs` / `io` / `Mutex` / … re-exports. Re-enable just `async`
# so the umbrella's own `compile_error!` for "select a client version" is
# satisfied; the runtime flag flows through whatever is set on
# `aerospike-core` itself.
aerospike = { path = "../", default-features = false, features = ["async"] }
aerospike-macro = {path = "../aerospike-macro"}
lazy_static = "1.5"
tokio = { version = "1.53.0", features = ["full"] }
webpki-roots = "1"
