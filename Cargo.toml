[package]
name = "aerospike"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true

# What the published crate carries. Everything else in the repository (CI,
# cargo aliases, the work registers, agent notes) stays out of the tarball.
# `tests/` ships because `benches/client_server.rs` includes `tests/common`
# and the `[[test]]` targets below name files that must exist.
include = [
    "/src/**",
    "/examples/**",
    "/benches/**",
    "/tests/**",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/MIGRATION.md",
    "/LICENSE.md",
]

[workspace.package]
version = "3.0.0-alpha.2"
edition = "2021"
rust-version = "1.87"
authors = ["Khosrow Afroozeh <khosrow@aerospike.com>", "Jan Hecking <jhecking@aerospike.com>"]
license = "Apache-2.0"
description = "Aerospike Client for Rust"
keywords = ["aerospike", "nosql", "distributed", "database"]
categories = ["database"]
homepage = "https://www.aerospike.com/"
repository = "https://github.com/aerospike/aerospike-client-rust/"
documentation = "https://docs.rs/aerospike/"
readme = "README.md"

[package.metadata.docs.rs]
# defaults already cover async, rt-tokio, tls, dynamic-config, serialization.
# Never all-features: async+sync and the two runtimes are mutually exclusive.
features = ["lua"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Path + version for every in-tree crate live in `[workspace.dependencies]`
# below, so a version bump touches one line.
aerospike-core = { workspace = true, optional = true }
aerospike-sync = { workspace = true, optional = true }
aerospike-macro = { workspace = true, optional = true }

[features]
default = ["async", "serialization", "rt-tokio", "tls", "dynamic-config"]
serialization = ["aerospike-core?/serialization", "aerospike-sync?/serialization"]
# Weak refs: applies to whichever client (async core / sync wrapper) is enabled.
dynamic-config = ["aerospike-core?/dynamic-config", "aerospike-sync?/dynamic-config"]
# Client-side Lua (query_aggregate / stream UDF). Compiles a vendored Lua 5.4
# interpreter; opt-in only. Weak refs like dynamic-config.
lua = ["aerospike-core?/lua", "aerospike-sync?/lua"]
async = ["aerospike-core"]
sync = ["aerospike-sync"]
rt-tokio = ["aerospike-core?/rt-tokio", "aerospike-macro/rt-tokio", "aerospike-sync?/rt-tokio"]
rt-async-std = ["aerospike-core?/rt-async-std", "aerospike-macro/rt-async-std", "aerospike-sync?/rt-async-std"]
# TLS is Tokio-only on either client: core's `tls` pulls in tokio-rustls and
# forwards the flag to `aerospike-rt`, whose guard rejects `tls` + `rt-async-std`.
tls = ["aerospike-core?/tls", "aerospike-sync?/tls"]

[[bench]]
name = "client_server"
harness = false
required-features = ["async"]

# The integration suites drive the async client.
[[test]]
name = "lib"
required-features = ["async"]

[[test]]
name = "client"
required-features = ["async"]

[[test]]
name = "batch_leak"
required-features = ["async"]

[workspace]
members = ["tools/benchmark", "aerospike-core", "aerospike-rt", "aerospike-sync", "aerospike-macro"]

# The in-tree crates depend on each other by path for development and by exact
# version once published; both are spelled here once. The version must match
# `[workspace.package] version`.
[workspace.dependencies]
aerospike-core = { path = "aerospike-core", version = "3.0.0-alpha.2" }
# No default features: the runtime (and tls/serialization) follow the facade's
# features, so `sync` works with either runtime.
aerospike-sync = { path = "aerospike-sync", version = "3.0.0-alpha.2", default-features = false }
aerospike-macro = { path = "aerospike-macro", version = "3.0.0-alpha.2" }
# No default features: `aerospike-rt` defaults to `rt-tokio` so it builds (and
# documents) on its own, but inside the workspace the runtime is always chosen
# by the client crate's `rt-*` feature.
aerospike-rt = { path = "aerospike-rt", version = "3.0.0-alpha.2", default-features = false }

[dev-dependencies]
log = "0.4.34"
env_logger = "0.11.11"
hex = "0.4"
bencher = "0.1"
serde_json = "1.0"
rand = "0.10"
lazy_static = "1.5"
aerospike-macro = { workspace = true }
aerospike-rt = { workspace = true }
futures = { version = "0.3.34" }
tokio = { version = "1.53.1", features = ["full"] }
proptest = "1.11.0"
tokio-rustls = {version = "0.26.5"}
rustls = {version = "0.23.45"}
webpki-roots = "1"
#console-subscriber = "0.1.5"

[[example]]
name = "batch_operations"
required-features = ["async"]

[[example]]
name = "bit_operations"
required-features = ["async"]

[[example]]
name = "cdt_operations"
required-features = ["async"]

[[example]]
name = "crud"
required-features = ["async"]

[[example]]
name = "geo_query"
required-features = ["async"]

[[example]]
name = "path_expression"
required-features = ["async"]

[[example]]
name = "query"
required-features = ["async"]

[[example]]
name = "record_operations"
required-features = ["async"]

[[example]]
name = "scan"
required-features = ["async"]

[[example]]
name = "server_info"
required-features = ["async"]

[[example]]
name = "timeout_configuration"
required-features = ["async"]

[[example]]
name = "transaction"
required-features = ["async"]

[[example]]
name = "udf"
required-features = ["async"]

[[example]]
name = "crud_sync"
required-features = ["sync"]

[[example]]
name = "query_aggregate"
required-features = ["lua"]

# Tests, examples and benches build policies field by field after `default()`,
# the way callers write them; the struct-update form the lint wants reads worse.
[lints.clippy]
field_reassign_with_default = "allow"
