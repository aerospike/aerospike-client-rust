[package]
name = "aerospike-macro"
description = "Aerospike Client for Rust Macros Crate. Not meant to be used independently."
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
proc-macro2 = "1.0.28"
syn = {version = "2.0.98", default-features = false, features = ["full", "derive", "parsing", "printing", "clone-impls", "proc-macro"]}
quote = {version = "1.0.6"}

# The `test` attribute macro emits a runtime-specific block; these flags only
# select which one. The `Config` derive needs neither, so the crate no longer
# links `aerospike-rt` (which would otherwise force a runtime selection on every
# consumer that just wants the derive).
[features]
rt-tokio = []
rt-async-std = []
