[package]
name = "aerospike-udf-ledger"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# No features: this module keeps every string in a `Str<N>` of its own and needs no allocator.
aerospike-udf-sdk-wasm = { path = "../.." }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true

# Its own workspace root, like the fixture beside it: a wasm32 cdylib cannot be a member of the host
# workspace. Build with `cargo build --release --target wasm32-unknown-unknown`.
[workspace]
