[package]
name = "aerospike-udf-sdk-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Write Aerospike user-defined functions in Rust, compiled to WebAssembly"
keywords = ["aerospike", "udf", "wasm", "webassembly"]
categories = ["database", "wasm"]
readme = "README.md"

[lib]
# Not a cdylib: this is the library a UDF crate depends on. The UDF crate is the cdylib. See examples/udf.
crate-type = ["lib"]

# **No dependencies, and no `alloc`.** The host never asks a guest to allocate — it writes only into buffers the
# guest already owns — so a UDF built on this needs no allocator at all. That is what makes a compiled UDF ~4 KB
# instead of ~40 KB, and it removed what profiling found to be the largest per-call cost in the alternative
# design. Adding a dependency here would most likely bring an allocator back with it.
[dependencies]
