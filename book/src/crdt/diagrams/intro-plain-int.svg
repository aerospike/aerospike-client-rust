<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="A plain integer cannot be merged" style="max-width:720px;width:100%;height:auto;display:block;margin:1.2em auto;font-family:inherit">
<title>A plain integer cannot be merged</title>
<style>
.lane { stroke: currentColor; stroke-opacity: .35; stroke-width: 1.5; }
.lanelabel { font-size: 13px; font-weight: 600; fill: currentColor; }
.lbl { font-size: 12px; fill: currentColor; }
.lbl.b { font-weight: 600; }
.mono { font-family: var(--mono-font, ui-monospace, monospace); font-size: 11.5px; fill: currentColor; }
.box { fill: none; stroke: currentColor; stroke-opacity: .45; rx: 4; }
.box.good { stroke: #2fa66b; stroke-opacity: 1; stroke-width: 1.5; }
.box.bad { stroke: #d9534f; stroke-opacity: 1; stroke-width: 1.5; }
.ship { fill: none; stroke: currentColor; stroke-opacity: .7; stroke-width: 1.4; marker-end: url(#arrow); }
.ship.dashed { stroke-dasharray: 5 4; }
.cap { font-size: 12.5px; fill: currentColor; fill-opacity: .85; }
.time { font-size: 11px; fill: currentColor; fill-opacity: .6; }
.tick { stroke: currentColor; stroke-opacity: .3; stroke-dasharray: 3 3; }
.bar { rx: 3; }
.barlbl { font-size: 12px; fill: #141414; }
.region { fill: currentColor; fill-opacity: .04; stroke: currentColor; stroke-opacity: .3; stroke-dasharray: 4 3; rx: 6; }
.node { fill: none; stroke: currentColor; stroke-opacity: .55; stroke-width: 1.2; rx: 5; }
.node.good { stroke: #2fa66b; stroke-opacity: 1; stroke-width: 1.5; }
.node.bad { stroke: #d9534f; stroke-opacity: 1; stroke-width: 1.5; }
.cell { fill: currentColor; fill-opacity: .07; stroke: currentColor; stroke-opacity: .5; }
.ship.bad { stroke: #d9534f; stroke-opacity: 1; marker-end: url(#arrow-bad); }
.slice { fill: currentColor; fill-opacity: .25; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="currentColor" fill-opacity=".75"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d9534f"/></marker></defs>
<line class="lane" x1="96" y1="96" x2="696" y2="96"/>
<text class="lanelabel" x="86" y="100" text-anchor="end" fill="#2f80ed" style="fill:#2f80ed">dc1</text>
<line class="lane" x1="96" y1="214" x2="696" y2="214"/>
<text class="lanelabel" x="86" y="218" text-anchor="end" fill="#e08a1e" style="fill:#e08a1e">dc2</text>
<text class="time" x="696" y="230" text-anchor="end">time →</text>
<rect class="box" x="129.2" y="42" width="41.6" height="23"/>
<text class="mono" x="136.2" y="57" xml:space="preserve">n: 3</text>
<rect class="box" x="129.2" y="240" width="41.6" height="23"/>
<text class="mono" x="136.2" y="255" xml:space="preserve">n: 3</text>
<circle cx="150" cy="96" r="5.5" fill="#2f80ed"/>
<text class="lbl" x="140" y="100" text-anchor="end">starts at 3</text>
<circle cx="150" cy="214" r="5.5" fill="#e08a1e"/>
<text class="lbl" x="140" y="218" text-anchor="end">starts at 3</text>
<circle cx="290" cy="96" r="5.5" fill="#2f80ed"/>
<text class="lbl b" x="280" y="100" text-anchor="end">n += 2</text>
<rect class="box" x="269.2" y="42" width="41.6" height="23"/>
<text class="mono" x="276.2" y="57" xml:space="preserve">n: 5</text>
<circle cx="290" cy="214" r="5.5" fill="#e08a1e"/>
<text class="lbl b" x="280" y="218" text-anchor="end">n += 5</text>
<rect class="box" x="269.2" y="240" width="41.6" height="23"/>
<text class="mono" x="276.2" y="255" xml:space="preserve">n: 8</text>
<line class="ship" x1="290" y1="104" x2="470" y2="205"/>
<line class="ship" x1="290" y1="206" x2="470" y2="105"/>
<path d="M470,89 L477,96 L470,103 L463,96 Z" fill="#d9534f"/>
<text class="lbl" x="481" y="100">pick a side</text>
<path d="M470,207 L477,214 L470,221 L463,214 Z" fill="#d9534f"/>
<text class="lbl" x="481" y="218">pick a side</text>
<rect class="box bad" x="414.7" y="42" width="110.6" height="23"/>
<text class="mono" x="421.7" y="57" xml:space="preserve">n: 5  or  n: 8</text>
<rect class="box bad" x="414.7" y="240" width="110.6" height="23"/>
<text class="mono" x="421.7" y="255" xml:space="preserve">n: 5  or  n: 8</text>
<text class="cap" x="360.0" y="288" text-anchor="middle">Both sides added to 3, and the answer is 10. Neither 5 nor 8 is it, and no rule over the two numbers recovers it.</text>
</svg>
