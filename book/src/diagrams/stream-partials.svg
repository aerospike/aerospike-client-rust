<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-label="One instance per query thread, one partial per thread, merged by the client" style="max-width:720px;width:100%;height:auto;display:block;margin:1.2em auto;font-family:inherit">
<title>One instance per query thread, one partial per thread, merged by the client</title>
<style>
.lane { stroke: currentColor; stroke-opacity: .35; stroke-width: 1.5; }
.lanelabel { font-size: 13px; font-weight: 600; fill: currentColor; }
.lbl { font-size: 12px; fill: currentColor; }
.lbl.b { font-weight: 600; }
.mono { font-family: var(--mono-font, ui-monospace, monospace); font-size: 11.5px; fill: currentColor; }
.box { fill: none; stroke: currentColor; stroke-opacity: .45; rx: 4; }
.box.good { stroke: #2fa66b; stroke-opacity: 1; stroke-width: 1.5; }
.box.bad { stroke: #d9534f; stroke-opacity: 1; stroke-width: 1.5; }
.ship { fill: none; stroke: currentColor; stroke-opacity: .7; stroke-width: 1.4; marker-end: url(#arrow); }
.ship.dashed { stroke-dasharray: 5 4; }
.cap { font-size: 12.5px; fill: currentColor; fill-opacity: .85; }
.time { font-size: 11px; fill: currentColor; fill-opacity: .6; }
.tick { stroke: currentColor; stroke-opacity: .3; stroke-dasharray: 3 3; }
.bar { rx: 3; }
.barlbl { font-size: 12px; fill: #141414; }
.region { fill: currentColor; fill-opacity: .04; stroke: currentColor; stroke-opacity: .3; stroke-dasharray: 4 3; rx: 6; }
.node { fill: none; stroke: currentColor; stroke-opacity: .55; stroke-width: 1.2; rx: 5; }
.node.good { stroke: #2fa66b; stroke-opacity: 1; stroke-width: 1.5; }
.node.bad { stroke: #d9534f; stroke-opacity: 1; stroke-width: 1.5; }
.cell { fill: currentColor; fill-opacity: .07; stroke: currentColor; stroke-opacity: .5; }
.ship.bad { stroke: #d9534f; stroke-opacity: 1; marker-end: url(#arrow-bad); }
.slice { fill: currentColor; fill-opacity: .25; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="currentColor" fill-opacity=".75"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d9534f"/></marker></defs>
<rect class="region" x="24" y="44" width="492" height="240"/>
<text class="lbl b" x="34" y="61" style="fill:#2f80ed">one node: the query runs on its query threads</text>
<text class="lbl b" x="40" y="108" text-anchor="start">thread 1</text>
<rect class="slice" x="104" y="97" width="12" height="14" rx="2"/>
<rect class="slice" x="122" y="97" width="12" height="14" rx="2"/>
<rect class="slice" x="140" y="97" width="12" height="14" rx="2"/>
<rect class="slice" x="158" y="97" width="12" height="14" rx="2"/>
<rect class="slice" x="176" y="97" width="12" height="14" rx="2"/>
<line class="ship" x1="196" y1="104" x2="212" y2="104"/>
<rect class="node" x="214" y="88" width="150" height="32"/>
<text class="lbl" x="289.0" y="101.0" text-anchor="middle">one instance, kept</text>
<text class="lbl" x="289.0" y="116.0" text-anchor="middle">topk_record per record</text>
<line class="ship" x1="364" y1="104" x2="380" y2="104"/>
<rect class="node" x="382" y="88" width="56" height="32"/>
<text class="lbl" x="410.0" y="101.0" text-anchor="middle">topk_end</text>
<text class="lbl" x="410.0" y="116.0" text-anchor="middle">once</text>
<line class="ship" x1="438" y1="104" x2="454" y2="104"/>
<rect class="node good" x="456" y="92" width="48" height="24"/>
<text class="lbl" x="480.0" y="108.5" text-anchor="middle">partial</text>
<line class="ship dashed" x1="504" y1="104" x2="566" y2="160"/>
<text class="lbl b" x="40" y="168" text-anchor="start">thread 2</text>
<rect class="slice" x="104" y="157" width="12" height="14" rx="2"/>
<rect class="slice" x="122" y="157" width="12" height="14" rx="2"/>
<rect class="slice" x="140" y="157" width="12" height="14" rx="2"/>
<rect class="slice" x="158" y="157" width="12" height="14" rx="2"/>
<rect class="slice" x="176" y="157" width="12" height="14" rx="2"/>
<line class="ship" x1="196" y1="164" x2="212" y2="164"/>
<rect class="node" x="214" y="148" width="150" height="32"/>
<text class="lbl" x="289.0" y="161.0" text-anchor="middle">one instance, kept</text>
<text class="lbl" x="289.0" y="176.0" text-anchor="middle">topk_record per record</text>
<line class="ship" x1="364" y1="164" x2="380" y2="164"/>
<rect class="node" x="382" y="148" width="56" height="32"/>
<text class="lbl" x="410.0" y="161.0" text-anchor="middle">topk_end</text>
<text class="lbl" x="410.0" y="176.0" text-anchor="middle">once</text>
<line class="ship" x1="438" y1="164" x2="454" y2="164"/>
<rect class="node good" x="456" y="152" width="48" height="24"/>
<text class="lbl" x="480.0" y="168.5" text-anchor="middle">partial</text>
<line class="ship dashed" x1="504" y1="164" x2="566" y2="160"/>
<text class="lbl b" x="40" y="228" text-anchor="start">thread 3</text>
<rect class="slice" x="104" y="217" width="12" height="14" rx="2"/>
<rect class="slice" x="122" y="217" width="12" height="14" rx="2"/>
<rect class="slice" x="140" y="217" width="12" height="14" rx="2"/>
<rect class="slice" x="158" y="217" width="12" height="14" rx="2"/>
<rect class="slice" x="176" y="217" width="12" height="14" rx="2"/>
<line class="ship" x1="196" y1="224" x2="212" y2="224"/>
<rect class="node" x="214" y="208" width="150" height="32"/>
<text class="lbl" x="289.0" y="221.0" text-anchor="middle">one instance, kept</text>
<text class="lbl" x="289.0" y="236.0" text-anchor="middle">topk_record per record</text>
<line class="ship" x1="364" y1="224" x2="380" y2="224"/>
<rect class="node" x="382" y="208" width="56" height="32"/>
<text class="lbl" x="410.0" y="221.0" text-anchor="middle">topk_end</text>
<text class="lbl" x="410.0" y="236.0" text-anchor="middle">once</text>
<line class="ship" x1="438" y1="224" x2="454" y2="224"/>
<rect class="node good" x="456" y="212" width="48" height="24"/>
<text class="lbl" x="480.0" y="228.5" text-anchor="middle">partial</text>
<line class="ship dashed" x1="504" y1="224" x2="566" y2="160"/>
<rect class="node good" x="566" y="130" width="130" height="60"/>
<text class="lbl" x="631.0" y="149.5" text-anchor="middle">the client</text>
<text class="lbl" x="631.0" y="164.5" text-anchor="middle">merges three partials</text>
<text class="lbl" x="631.0" y="179.5" text-anchor="middle">per node</text>
<text class="time" x="104" y="252" text-anchor="start">partition streams, one after another</text>
<text class="time" x="270" y="272" text-anchor="middle">state lives in the module's memory: static mut, package variables, statics</text>
<text class="cap" x="360.0" y="308" text-anchor="middle">Lua's reduce ran on the client for you. Here the end function returns a partial that is cheap to merge, and a</text>
<text class="cap" x="360.0" y="325" text-anchor="middle">query over a node is a handful of partials rather than one per partition.</text>
</svg>
