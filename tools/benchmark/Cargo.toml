[package]
name = "aerospike-client-rust-benchmark"
version = "0.1.0"
description = "Benchmark suite for the Aerospike Rust client"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
# A development tool, never a crates.io package.
publish = false

[dependencies]
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
lazy_static = "1.5"
rand = { version = "0.10" }
aerospike = { path = "../.." }
# Minimal features to reduce Tokio task heap and binary size (no fs, process, signal, etc.)
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "macros"] }

[[bin]]
path = "src/main.rs"
name = "benchmark"
