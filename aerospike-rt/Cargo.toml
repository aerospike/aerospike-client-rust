[package]
name = "aerospike-rt"
description = "Aerospike Client for Rust Runtime Crate. Not meant to be used independently."
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# "macros" is for `tokio::select!` in the client's connection layer, which
# reaches tokio only through this crate's re-export.
tokio = { version = "1.53.1", features = ["fs", "net", "rt", "rt-multi-thread", "time", "io-util", "sync", "macros"], optional = true }
# "io_safety" gates async-std AsFd/AsSocket impls, which the connection layer
# needs to borrow a socket for its liveness probe without taking ownership of the
# fd. The feature adds no code of its own.
async-std = {version = "1.13.2", features = ["io_safety"], optional = true}
async-lock = { version = "3.4.2", optional = true}

[features]
# A default runtime so the crate builds on its own: `cargo publish` verifies the
# packaged tarball with default features, and docs.rs builds it the same way.
# The client crates depend on this crate with `default-features = false` and
# pick the runtime through their own `rt-*` feature.
default = ["rt-tokio"]
rt-tokio = ["tokio"]
rt-async-std = ["async-std", "async-lock"]
# No code of its own: enables the guard that rejects `tls` + `rt-async-std`.
tls = []

[package.metadata.docs.rs]
features = ["rt-tokio"]
rustdoc-args = ["--cfg", "docsrs"]
