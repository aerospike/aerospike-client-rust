<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Each cluster merges the other's write and both reach the same record; the merge ships nothing" style="max-width:720px;width:100%;height:auto;display:block;margin:1.2em auto;font-family:inherit">
<title>Each cluster merges the other's write and both reach the same record; the merge ships nothing</title>
<style>
.lane { stroke: currentColor; stroke-opacity: .35; stroke-width: 1.5; }
.lanelabel { font-size: 13px; font-weight: 600; fill: currentColor; }
.lbl { font-size: 12px; fill: currentColor; }
.lbl.b { font-weight: 600; }
.mono { font-family: var(--mono-font, ui-monospace, monospace); font-size: 11.5px; fill: currentColor; }
.box { fill: none; stroke: currentColor; stroke-opacity: .45; rx: 4; }
.box.good { stroke: #2fa66b; stroke-opacity: 1; stroke-width: 1.5; }
.ship { fill: none; stroke: currentColor; stroke-opacity: .7; stroke-width: 1.4; marker-end: url(#arrow); }
.cap { font-size: 12.5px; fill: currentColor; fill-opacity: .85; }
.time { font-size: 11px; fill: currentColor; fill-opacity: .6; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="currentColor" fill-opacity=".75"/></marker></defs>
<line class="lane" x1="96" y1="96" x2="696" y2="96"/>
<text class="lanelabel" x="86" y="100" text-anchor="end" fill="#2f80ed" style="fill:#2f80ed">dc1</text>
<line class="lane" x1="96" y1="214" x2="696" y2="214"/>
<text class="lanelabel" x="86" y="218" text-anchor="end" fill="#e08a1e" style="fill:#e08a1e">dc2</text>
<text class="time" x="696" y="230" text-anchor="end">time →</text>
<circle cx="160" cy="96" r="5.5" fill="#2f80ed"/>
<text class="lbl b" x="150" y="80" text-anchor="end">a write</text>
<rect class="box" x="149" y="42" width="27" height="23"/>
<text class="mono" x="154" y="57" xml:space="preserve">W1</text>
<circle cx="160" cy="214" r="5.5" fill="#e08a1e"/>
<text class="lbl b" x="150" y="238" text-anchor="end">a write</text>
<rect class="box" x="149" y="246" width="27" height="23"/>
<text class="mono" x="154" y="261" xml:space="preserve">W2</text>
<line class="ship" x1="166" y1="102" x2="400" y2="206"/>
<line class="ship" x1="166" y1="208" x2="400" y2="104"/>
<text class="time" x="200" y="140">W1 ships</text>
<text class="time" x="200" y="180">W2 ships</text>
<path d="M410,89 L417,96 L410,103 L403,96 Z" fill="#2fa66b"/>
<text class="lbl" x="424" y="100">merge(W1, W2) = R</text>
<path d="M410,207 L417,214 L410,221 L403,214 Z" fill="#2fa66b"/>
<text class="lbl" x="424" y="218">merge(W2, W1) = R</text>
<rect class="box good" x="560" y="42" width="27" height="23"/>
<text class="mono" x="569" y="57" xml:space="preserve">R</text>
<rect class="box good" x="560" y="246" width="27" height="23"/>
<text class="mono" x="569" y="261" xml:space="preserve">R</text>
<text class="time" x="573" y="159" text-anchor="middle">no ship: both hold R</text>
<text class="cap" x="360.0" y="292" text-anchor="middle">Each cluster merges the other's write into its own and reaches the same record by itself. The merge</text>
<text class="cap" x="360.0" y="309" text-anchor="middle">ships nothing: what each cluster changed travels with that cluster's own write.</text>
</svg>
