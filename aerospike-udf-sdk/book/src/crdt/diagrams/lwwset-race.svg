<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="A later stamp brings a removed tag back" style="max-width:720px;width:100%;height:auto;display:block;margin:1.2em auto;font-family:inherit">
<title>A later stamp brings a removed tag back</title>
<style>
.lane { stroke: currentColor; stroke-opacity: .35; stroke-width: 1.5; }
.lanelabel { font-size: 13px; font-weight: 600; fill: currentColor; }
.lbl { font-size: 12px; fill: currentColor; }
.lbl.b { font-weight: 600; }
.mono { font-family: var(--mono-font, ui-monospace, monospace); font-size: 11.5px; fill: currentColor; }
.box { fill: none; stroke: currentColor; stroke-opacity: .45; rx: 4; }
.box.good { stroke: #2fa66b; stroke-opacity: 1; stroke-width: 1.5; }
.box.bad { stroke: #d9534f; stroke-opacity: 1; stroke-width: 1.5; }
.ship { fill: none; stroke: currentColor; stroke-opacity: .7; stroke-width: 1.4; marker-end: url(#arrow); }
.ship.dashed { stroke-dasharray: 5 4; }
.cap { font-size: 12.5px; fill: currentColor; fill-opacity: .85; }
.time { font-size: 11px; fill: currentColor; fill-opacity: .6; }
.tick { stroke: currentColor; stroke-opacity: .3; stroke-dasharray: 3 3; }
.bar { rx: 3; }
.barlbl { font-size: 12px; fill: #141414; }
.region { fill: currentColor; fill-opacity: .04; stroke: currentColor; stroke-opacity: .3; stroke-dasharray: 4 3; rx: 6; }
.node { fill: none; stroke: currentColor; stroke-opacity: .55; stroke-width: 1.2; rx: 5; }
.node.good { stroke: #2fa66b; stroke-opacity: 1; stroke-width: 1.5; }
.node.bad { stroke: #d9534f; stroke-opacity: 1; stroke-width: 1.5; }
.cell { fill: currentColor; fill-opacity: .07; stroke: currentColor; stroke-opacity: .5; }
.ship.bad { stroke: #d9534f; stroke-opacity: 1; marker-end: url(#arrow-bad); }
.slice { fill: currentColor; fill-opacity: .25; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="currentColor" fill-opacity=".75"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d9534f"/></marker></defs>
<line class="lane" x1="96" y1="100" x2="696" y2="100"/>
<text class="lanelabel" x="86" y="104" text-anchor="end" fill="#2f80ed" style="fill:#2f80ed">dc1</text>
<line class="lane" x1="96" y1="220" x2="696" y2="220"/>
<text class="lanelabel" x="86" y="224" text-anchor="end" fill="#e08a1e" style="fill:#e08a1e">dc2</text>
<text class="time" x="696" y="236" text-anchor="end">time →</text>
<rect class="box" x="100.0" y="36" width="96.8" height="38"/>
<text class="mono" x="107.0" y="51" xml:space="preserve">+ {news:100}</text>
<text class="mono" x="107.0" y="66" xml:space="preserve">- {}</text>
<rect class="box" x="100.0" y="246" width="96.8" height="38"/>
<text class="mono" x="107.0" y="261" xml:space="preserve">+ {news:100}</text>
<text class="mono" x="107.0" y="276" xml:space="preserve">- {}</text>
<circle cx="290" cy="100" r="5.5" fill="#2f80ed"/>
<text class="lbl b" x="280" y="104" text-anchor="end">add(art) @200</text>
<rect class="box" x="210.6" y="36" width="158.9" height="38"/>
<text class="mono" x="217.6" y="51" xml:space="preserve">+ {art:200, news:100}</text>
<text class="mono" x="217.6" y="66" xml:space="preserve">- {}</text>
<circle cx="290" cy="220" r="5.5" fill="#e08a1e"/>
<text class="lbl b" x="280" y="224" text-anchor="end">remove(news) @200</text>
<rect class="box" x="241.6" y="246" width="96.8" height="38"/>
<text class="mono" x="248.6" y="261" xml:space="preserve">+ {news:100}</text>
<text class="mono" x="248.6" y="276" xml:space="preserve">- {news:200}</text>
<line class="ship" x1="290" y1="108" x2="470" y2="211"/>
<line class="ship" x1="290" y1="212" x2="470" y2="109"/>
<path d="M470,93 L477,100 L470,107 L463,100 Z" fill="#2fa66b"/>
<text class="lbl" x="470" y="88" text-anchor="middle">max per tag</text>
<path d="M470,213 L477,220 L470,227 L463,220 Z" fill="#2fa66b"/>
<text class="lbl" x="470" y="238" text-anchor="middle">max per tag</text>
<rect class="box good" x="390.6" y="36" width="158.9" height="38"/>
<text class="mono" x="397.6" y="51" xml:space="preserve">+ {art:200, news:100}</text>
<text class="mono" x="397.6" y="66" xml:space="preserve">- {news:200}  → [art]</text>
<rect class="box good" x="390.6" y="246" width="158.9" height="38"/>
<text class="mono" x="397.6" y="261" xml:space="preserve">+ {art:200, news:100}</text>
<text class="mono" x="397.6" y="276" xml:space="preserve">- {news:200}  → [art]</text>
<circle cx="600" cy="100" r="5.5" fill="#2f80ed"/>
<text class="lbl b" x="590" y="104" text-anchor="end">add(news) @400</text>
<rect class="box good" x="584.7" y="36" width="110.6" height="38"/>
<text class="mono" x="591.7" y="51" xml:space="preserve">news 400 &gt; 200</text>
<text class="mono" x="591.7" y="66" xml:space="preserve">→ [art, news]</text>
<line class="ship" x1="600" y1="108" x2="665" y2="211"/>
<path d="M665,213 L672,220 L665,227 L658,220 Z" fill="#2fa66b"/>
<text class="cap" x="360.0" y="314" text-anchor="middle">The same race as step 3, with stamps (+ is addedAt, - is removedAt). The re-add at 400 outranks the removal</text>
<text class="cap" x="360.0" y="331" text-anchor="middle">at 200 on both sides, because the member test compares stamps instead of looking for a tombstone.</text>
</svg>
