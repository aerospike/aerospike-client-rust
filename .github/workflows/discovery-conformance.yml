name: Discovery conformance

# L1: the shared aerospike-client-conformance fixture set, run through
# tests/conformance.rs. The fixture set is a public repository checked out at a
# pinned commit; the report is checked against the fixtures and
# tests/conformance/rust-declared.yaml by the repository's own collector.

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - v3
  push:
    branches:
      - main
      - v3
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  l1:
    name: L1 conformance
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Checkout the conformance fixture set
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: aerospike/aerospike-client-conformance
          # main at VERSION 1.1.0, the version tests/conformance.rs pins;
          # repin to the v1.1.0 tag once the fixture set is tagged.
          ref: f66304f36d1cded608e4d6c199622266e2db1dc3
          path: conformance

      - name: Install Rust 1.87 (MSRV)
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, 2026-10
        with:
          toolchain: 1.87

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: conformance

      - name: Setup Python
        # The dns and aws-tags rows need the fixture server the set ships, and
        # the collector installs PyYAML.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run the conformance fixtures
        env:
          CONFORMANCE_DIR: ${{ github.workspace }}/conformance
          CONFORMANCE_REPORT: ${{ github.workspace }}/target/conformance/conformance-report.json
        run: |
          cargo test --test conformance --no-default-features \
            --features async,serialization,rt-tokio,tls,discovery-aws -- --nocapture

      - name: Upload the conformance report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-report-rust
          path: target/conformance/conformance-report.json
          if-no-files-found: warn

      - name: Collect the conformance report
        if: ${{ always() }}
        uses: ./conformance/.github/actions/collect-conformance-report
        with:
          reports-directory: target/conformance
          fixtures-directory: ${{ github.workspace }}/conformance
          declarations-directory: tests/conformance
