name: Rust Build & Release

permissions:
  id-token: write
  packages: write
  contents: read
  attestations: write

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-rc*'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

jobs:
  build-stage:
    name: Build and create release bundle
    uses: ./.github/workflows/build-release.yml
    secrets: inherit
