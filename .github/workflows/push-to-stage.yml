name: Rust Build & Release

permissions:
  id-token: write
  packages: write
  contents: read
  attestations: write

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-rc*'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

jobs:
  # The same gate a pull request passes: lint, docs.rs build, packaging
  # rehearsal, and the server legs. Nothing is packaged if it fails.
  gate:
    name: Pull-request gate
    uses: ./.github/workflows/build-test.yml
    secrets: inherit

  build-stage:
    name: Build and create release bundle
    needs: gate
    uses: ./.github/workflows/build-release.yml
    secrets: inherit
