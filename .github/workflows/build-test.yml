name: Aerospike Rust Client CI

on:
  pull_request:
    branches:
      - main
      - v3
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  AEROSPIKE_HOSTS: 127.0.0.1:3000
  AEROSPIKE_NAMESPACE: test
  PROPTEST_CASES: 25

jobs:
  test:
    name: test (${{ matrix.runtime }})
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        runtime: [rt-tokio, rt-async-std]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust 1.87 (MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.87

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.runtime }}

      - name: Set up Aerospike Database
        uses: reugn/github-action-aerospike@2065a9209cfd5ef88a3e07f3e7929e321d1e0067 # v1.1.0

      - name: Build workspace
        run: |
          cargo build --verbose --workspace --exclude aerospike-client-rust-benchmark \
            --no-default-features \
            --features serialization,async,${{ matrix.runtime }}

      - name: Run integration tests
        run: |
          cargo test --verbose -p aerospike \
            --no-default-features \
            --features serialization,async,${{ matrix.runtime }} \
            -- --test-threads=1

      - name: Run aerospike-sync doctests
        if: matrix.runtime == 'rt-tokio'
        run: cargo test --doc -p aerospike-sync --features rt-tokio

      - name: Run aerospike-core doctests
        if: matrix.runtime == 'rt-tokio'
        run: |
          # aerospike-core doc examples use `use aerospike::…`; enable rt-tokio on the path dev-dep.
          sed -i 's/features = \["async"\]/features = ["async", "rt-tokio"]/' aerospike-core/Cargo.toml
          cargo test --doc -p aerospike-core --features rt-tokio,serialization

  aerospike-core-coverage:
    name: aerospike-core-coverage
    runs-on: ubuntu-22.04

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust 1.87 (MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.87

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: aerospike-core-coverage

      - name: Set up Aerospike Database
        uses: reugn/github-action-aerospike@2065a9209cfd5ef88a3e07f3e7929e321d1e0067 # v1.1.0

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-llvm-cov

      # Coverage denominator is aerospike-core only (see CLIENT-5292): the root
      # `aerospike` crate is an 11-line re-export facade, and reporting against it
      # instead of aerospike-core silently produces an empty/near-empty report.
      # aerospike-core's own inline unit tests and the integration/proptest suite
      # (run via the `aerospike` package) are collected separately, then merged
      # into one report scoped to aerospike-core.
      #
      # Doc tests are intentionally excluded from this number for now (undecided,
      # tracked on the ticket) even though they run and must pass in the `test` job.
      - name: Coverage - aerospike-core unit tests
        env:
          PROPTEST_MAX_SHRINK_ITERS: 0
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov -p aerospike-core \
            --no-default-features --features serialization,rt-tokio \
            --ignore-run-fail --no-report

      - name: Coverage - aerospike integration and property tests
        env:
          PROPTEST_MAX_SHRINK_ITERS: 0
        run: |
          cargo llvm-cov -p aerospike \
            --no-default-features --features serialization,async,rt-tokio \
            --ignore-run-fail --no-report -- --test-threads=1

      # Soft floor while coverage tooling beds in: current aerospike-core baseline
      # is ~79% (recorded on CLIENT-5292). 75% leaves headroom to catch a real
      # regression without blocking on day one; raise to 80% once confirmed.
      - name: Coverage report (aerospike-core)
        run: cargo llvm-cov report -p aerospike-core --fail-under-lines 75
