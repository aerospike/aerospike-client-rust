name: Discovery L2 run

# One L2 profile: the discovery-l2-topology action of
# aerospike-client-conformance builds a three node cluster behind Toxiproxy on
# a client-only network, the discovery_l2 test binary is built on the runner,
# and a container on that network runs it with the topology's environment.

on:
  workflow_call:
    inputs:
      subset:
        description: ce runs a community cluster without TLS, ee an enterprise cluster with TLS
        type: string
        required: true
      server-container-repo:
        description: Aerospike image repository path
        type: string
        required: true
      server-tag:
        description: Aerospike image tag
        type: string
        required: true
      tls-listen-port-base:
        description: First TLS proxy listen port. Empty skips TLS proxies.
        type: string
        required: false
        default: ""
      profile:
        description: >-
          A discovery-l2-topology profile: default, reachable, pass-through-names,
          pass-through-ports, port-map-range, cn-only, low-mtu, port-range or
          idle-reset
        type: string
        required: false
        default: default

permissions:
  id-token: write  # required by setup-aerospike-server's JFrog OIDC login
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  L2_FEATURES: async,serialization,rt-tokio,tls

jobs:
  l2:
    name: cluster
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust 1.87 (MSRV)
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, 2026-10
        with:
          toolchain: 1.87

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: discovery-l2

      - name: Build the L2 test binary
        # Built on the runner and run in an ubuntu:24.04 container, the
        # runner's own distribution, so the binary finds the same libc.
        run: |
          set -euo pipefail
          mkdir -p target/l2
          cargo test --test discovery_l2 --no-default-features --features "$L2_FEATURES" \
            --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "discovery_l2") | .executable' \
            | tail -1 \
            | xargs -I{} cp {} target/l2/discovery_l2
          test -x target/l2/discovery_l2

      - name: Setup L2 topology
        id: l2
        # main at VERSION 1.1.0; repin to the v1.1.0 tag once the fixture set is tagged.
        uses: aerospike/aerospike-client-conformance/.github/actions/discovery-l2-topology@f66304f36d1cded608e4d6c199622266e2db1dc3
        with:
          profile: ${{ inputs.profile }}
          subset: ${{ inputs.subset }}
          server-edition: ${{ inputs.subset == 'ee' && 'enterprise' || 'community' }}
          server-container-repo: ${{ inputs.server-container-repo }}
          server-tag: ${{ inputs.server-tag }}
          enable-tls: ${{ inputs.subset == 'ee' }}
          tls-listen-port-base: ${{ inputs.tls-listen-port-base }}
          features-content: ${{ inputs.subset == 'ee' && secrets.AEROSPIKE_SERVER_FEATURES_CONF || '' }}
          oidc-provider: ${{ vars.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE }}

      - name: Run the L2 discovery rows
        env:
          CLIENT_NETWORK: ${{ steps.l2.outputs.client-network }}
          ENV_FILE: ${{ steps.l2.outputs.env-file }}
          CLIENT_HOSTS: ${{ steps.l2.outputs.client-hosts }}
          TLS_CERT_DIR: ${{ steps.l2.outputs.tls-cert-dir }}
          DISCOVERY_SUBSET: ${{ inputs.subset }}
          L2_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          run_args=(
            --rm
            --network "${CLIENT_NETWORK}"
            --workdir "${GITHUB_WORKSPACE}"
            --env-file "${ENV_FILE}"
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}"
            -e L2_PROFILE
            -e "L2_TEST_BINARY=${GITHUB_WORKSPACE}/target/l2/discovery_l2"
            -e RUST_BACKTRACE
          )
          if [[ "${DISCOVERY_SUBSET}" == "ee" ]]; then
            run_args+=(-v "${TLS_CERT_DIR}:/aerospike-tls:ro")
            run_args+=(-e "AEROSPIKE_CA_CERT=/aerospike-tls/ca.crt")
          fi
          IFS=',' read -r -a client_hosts <<< "${CLIENT_HOSTS}"
          for host in "${client_hosts[@]}"; do
            [[ -n "${host}" ]] && run_args+=(--add-host "${host}")
          done
          mkdir -p target/l2
          docker run "${run_args[@]}" ubuntu:24.04 \
            bash .github/discovery/run-l2-suite.sh 2>&1 | tee "target/l2/${DISCOVERY_SUBSET}-${L2_PROFILE}.log"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Show the node server log
        if: ${{ always() && steps.l2.outputs.node-server-log != '' }}
        env:
          LOG_FILE: ${{ steps.l2.outputs.node-server-log }}
        run: cat "${LOG_FILE}"

      - name: Fix bind-mount ownership
        if: ${{ always() }}
        run: sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"

      - name: Upload the run log
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: discovery-l2-${{ inputs.subset }}-${{ inputs.profile }}
          path: target/l2/*.log
          if-no-files-found: warn
          retention-days: 7
